name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发版 tag 与四处版本号一致，否则直接失败（见 docs/release.md）
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/desktop/scripts/check-versions.mjs

  # Rust 工作区在三平台都能编译（提早发现平台相关问题）
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # RUSTUP_TOOLCHAIN 优先级高于根目录 rust-toolchain.toml（stable），
    # 强制 CI 用钉死的工具链，避免 stable 新 clippy lint 误伤 -D warnings
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio deps (cpal/ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 钉死工具链：-D warnings 下任何新 clippy lint 都会红，
          # 钉住后 lint 集合冻结，升级即有意的 bump。
          # 1.88 是下限：as_chunks 需要 1.88，icu_* 依赖也要求 1.88+。
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop exec tsc --noEmit
      - run: pnpm --dir apps/desktop build
