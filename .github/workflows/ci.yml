name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发版 tag 与四处版本号一致，否则直接失败（见 docs/release.md）
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/desktop/scripts/check-versions.mjs

  # Rust 工作区在三平台都能编译（提早发现平台相关问题）
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio deps (cpal/ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 跟随 stable（与 rust-toolchain.toml、本地开发一致）。
          # 注意：不要在这里加 -D warnings，stable 的新 lint 会导致无辜变红；
          # clippy 只做建议性检查，真正的门禁是下面的 cargo check 和 fmt。
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop exec tsc --noEmit
      - run: pnpm --dir apps/desktop build
