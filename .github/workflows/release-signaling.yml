name: Release Signaling

# 信令服务器三平台二进制：Linux x64 / macOS ARM64 / Windows x64。
# tag 形如 signaling-v0.2.0（与桌面端 v*.*.* 互不干扰）。
on:
  push:
    tags:
      - "signaling-v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: signaling

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/signaling-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
          || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
               --draft --title "Signaling ${{ github.ref_name }}" \
               --notes "signaling 独立发版，与桌面端互不影响。"

  build:
    needs: create-release
    # workflow_dispatch 手动触发时 create-release 被跳过，needs 仍可运行（skipped 视为满足）
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio deps (cpal/ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config build-essential
      - run: cargo build --release -p signaling --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG:-manual}"
          OUT="signaling-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$OUT" -C target/${{ matrix.target }}/release signaling
          echo "ASSET=$OUT" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          if (-not $Tag) { $Tag = "manual" }
          $Out = "signaling-$Tag-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/signaling.exe" -DestinationPath $Out
          "ASSET=$Out" >> $env:GITHUB_ENV

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/signaling-')
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber --repo "${{ github.repository }}"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/signaling-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
