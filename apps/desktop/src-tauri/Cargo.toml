[package]
name = "gamevoice-desktop"
version = "0.2.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
device_query = "4"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net"] }
uuid = { version = "1", features = ["v4"] }
signaling = { path = "../../signaling" }
voice-common = { path = "../../../crates/voice-common" }
voice-core = { path = "../../../crates/voice-core" }
voice-session = { path = "../../../crates/voice-session" }
voice-webrtc = { path = "../../../crates/voice-webrtc" }
