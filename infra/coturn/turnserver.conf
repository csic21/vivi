# GameVoice coturn（Week 6 本地联调 / 生产模板）
#
# 认证：TURN REST API（use-auth-secret）。signaling 用同样的 static-auth-secret
# 给客户端签临时凭证（GET /turn/credentials），coturn 验证，无需同步用户表。
# 生产必须替换 static-auth-secret（环境变量注入，不要提交到仓库）！

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=dev-secret-change-me
realm=gamevoice
log-file=stdout
# 本地联调允许 loopback relay（生产可删）
allow-loopback-peers
# relay 端口段（docker 发布时按需映射；默认全开由 OS 分配）
min-port=49160
max-port=49200
