services:
  signaling:
    build: ../../apps/signaling
    ports:
      - "8080:8080"
    environment:
      TURN_SECRET: ${TURN_SECRET:-dev-secret-change-me}
      TURN_URLS: ${TURN_URLS:-turn:coturn:3478}
    command: cargo run -p signaling
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
